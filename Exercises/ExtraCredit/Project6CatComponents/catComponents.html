<!DOCTYPE html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link href="catComponents.css" rel="stylesheet" />
    <style>
      img {
        width: 500px;
      }
      button {
        width: 80px;
        background-color: grey;
        color: white;
        padding: 8px;
        border-radius: 12px;
        border: solid black 4px;
      }

      .catbox {
        border: 2px solid black;
        padding: 20px;
        margin: 20px;
        display: inline-block;
        vertical-align: top;
      }
    </style>
  </head>

  <body>
    <div id="bobcat">
      <button v-on:click="selected = 'abob'">American Bobtail</button>
      <button v-on:click="selected = 'manx'">Manx</button>
      <button v-on:click="selected = 'siam'">Siamese</button>
      <button v-on:click="selected = 'beng'">Bengal</button>
      <button v-on:click="selected = 'pers'">Persian</button>

      <div class="catbox">
        <cat-slideshow :whichcat="selected"></cat-slideshow>
      </div>
    </div>
  </body>

  <script src="js/catComponents.js"></script>
</html>
