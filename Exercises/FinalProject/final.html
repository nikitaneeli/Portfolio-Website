<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Explorer</title>
    <link rel="stylesheet" href="final.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <h1><i class="fas fa-film"></i> Movie Finder!</h1>
        <div class="search-container">
          <input type="text" id="search" placeholder="search movies!" />
          <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="filter-buttons">
        <button id="popular-btn" class="active">
          <i class="fas fa-fire"></i> Popular
        </button>
        <button id="top-rated-btn">
          <i class="fas fa-star"></i> Top Rated
        </button>
        <a href="reflection.html" class="reflection-btn">
          <i class="fas fa-file-alt"></i> Reflection
        </a>
      </div>

      <div id="movies" class="movies-grid"></div>

      <div id="movie-details" class="modal">
        <div class="modal-content">
          <span class="close">&times;</span>
          <div class="modal-poster">
            <img id="modal-poster-img" src="" alt="" />
          </div>
          <div class="modal-info">
            <h2 id="modal-title"></h2>
            <div class="movie-meta">
              <span id="modal-date"></span>
              <span id="modal-rating"></span>
            </div>
            <h3>Overview</h3>
            <p id="modal-overview"></p>
          </div>
        </div>
      </div>
    </main>

    <script src="js/final.js"></script>
  </body>
</html>
